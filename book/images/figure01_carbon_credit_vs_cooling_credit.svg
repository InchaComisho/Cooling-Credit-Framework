<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
<style>
text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif}
.title{font-size:68px;font-weight:700;fill:#16324F}.subtitle{font-size:34px;fill:#52616B}
.boxtitle{font-size:48px;font-weight:700;fill:#16324F}.boxsub{font-size:36px;font-weight:700}
.item{font-size:32px;fill:#17202A}.question{font-size:34px;font-weight:700;fill:#16324F}
.caption{font-size:28px;fill:#52616B}.small{font-size:26px}
</style>
<rect width="100%" height="100%" fill="#F7FAFC"/>
<text x="1200.0" y="122" text-anchor="middle" class="title">カーボンクレジットとクーリングクレジットの違い</text>
<text x="1200.0" y="200" text-anchor="middle" class="subtitle">炭素会計から、冷却価値評価へ</text>
<rect x="130" y="270" width="870" height="980" rx="38" fill="#E8F0F7" stroke="#4B6F8F" stroke-width="5"/>
<rect x="1400" y="270" width="870" height="980" rx="38" fill="#E7F5EF" stroke="#3A7D67" stroke-width="5"/>
<text x="565.0" y="365" text-anchor="middle" class="boxtitle">カーボンクレジット</text>
<text x="565.0" y="430" text-anchor="middle" class="boxsub" fill="#4B6F8F">炭素を数える</text>
<text x="1835.0" y="365" text-anchor="middle" class="boxtitle">クーリングクレジット</text>
<text x="1835.0" y="430" text-anchor="middle" class="boxsub" fill="#3A7D67">冷却価値を測る</text>
<circle cx="249" cy="532" r="9" fill="#4B6F8F"/>
<text x="276" y="540" class="item">CO₂排出削減</text>
<circle cx="249" cy="602" r="9" fill="#4B6F8F"/>
<text x="276" y="610" class="item">CO₂吸収</text>
<circle cx="249" cy="672" r="9" fill="#4B6F8F"/>
<text x="276" y="680" class="item">排出回避</text>
<circle cx="249" cy="742" r="9" fill="#4B6F8F"/>
<text x="276" y="750" class="item">排出相殺</text>
<circle cx="249" cy="812" r="9" fill="#4B6F8F"/>
<text x="276" y="820" class="item">炭素会計</text>
<circle cx="249" cy="882" r="9" fill="#4B6F8F"/>
<text x="276" y="890" class="item">CO₂換算トン</text>
<circle cx="249" cy="952" r="9" fill="#4B6F8F"/>
<text x="276" y="960" class="item">カーボンニュートラル表示</text>
<circle cx="1499" cy="532" r="9" fill="#3A7D67"/>
<text x="1526" y="540" class="item">熱負荷低減</text>
<circle cx="1499" cy="602" r="9" fill="#3A7D67"/>
<text x="1526" y="610" class="item">水循環回復</text>
<circle cx="1499" cy="672" r="9" fill="#3A7D67"/>
<text x="1526" y="680" class="item">土壌再生</text>
<circle cx="1499" cy="742" r="9" fill="#3A7D67"/>
<text x="1526" y="750" class="item">森林蒸散回復</text>
<circle cx="1499" cy="812" r="9" fill="#3A7D67"/>
<text x="1526" y="820" class="item">海洋・沿岸循環支援</text>
<circle cx="1499" cy="882" r="9" fill="#3A7D67"/>
<text x="1526" y="890" class="item">都市冷却</text>
<circle cx="1499" cy="952" r="9" fill="#3A7D67"/>
<text x="1526" y="960" class="item">自然冷却機能回復</text>
<circle cx="1499" cy="1022" r="9" fill="#3A7D67"/>
<text x="1526" y="1030" class="item">冷房需要・熱中症リスク低減</text>
<rect x="200" y="1045" width="730" height="150" rx="28" fill="white" stroke="#4B6F8F" stroke-width="3"/>
<rect x="1470" y="1045" width="730" height="150" rx="28" fill="white" stroke="#3A7D67" stroke-width="3"/>
<text x="565.0" y="1100" text-anchor="middle" class="question">問い：CO₂をどれだけ</text>
<text x="565.0" y="1150" text-anchor="middle" class="question">減らしたか</text>
<text x="1835.0" y="1100" text-anchor="middle" class="question">問い：それは実際に</text>
<text x="1835.0" y="1150" text-anchor="middle" class="question">冷やしたのか</text>
<line x1="1055" y1="760" x2="1345" y2="760" stroke="#2F80ED" stroke-width="20" stroke-linecap="round"/>
<polygon points="1345,760 1290,720 1290,800" fill="#2F80ED"/>
<rect x="1050.0" y="660" width="300" height="72" rx="22" fill="white" stroke="#2F80ED" stroke-width="3"/>
<text x="1200.0" y="708" text-anchor="middle" class="small" fill="#2F80ED">評価軸の拡張</text>
<text x="1200.0" y="1328" text-anchor="middle" class="caption">カーボンクレジットはCO₂を中心に評価する。</text>
<text x="1200.0" y="1370" text-anchor="middle" class="caption">クーリングクレジットは、CO₂だけでは測れない実際の冷却価値を評価する。</text>
<text x="1200.0" y="1455" text-anchor="middle" class="small" fill="#16324F">図1　カーボンクレジットとクーリングクレジットの違い</text>
</svg>